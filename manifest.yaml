# manifest.yaml
# Lives in the moto-platform workspace root (not a repo itself). Records which
# version of each repo is known to work together. Update it whenever a new
# "known good combination" is established. Org: github.com/moto-platform (D-002).

repos:
  - name: moto-vehicle-defs
    url: https://github.com/moto-platform/moto-vehicle-defs.git
    ref: v0.14.0          # commit d65ab9a (rt-core DID 0xFD03 LEAN_HEALTH, D-067/E-17 (a); derived stale_after_ms >= slowest input period, 34 signals corrected; rt-core stays on its pin until E-17 (a) + E-19); v0.13.0 = f43c90a (D-070: vehicle constants + 126 derived signal definitions, additive; server main takes it for the derived-signal Python reference, server#11, no release yet); v0.12.0 = d8e49ae (D-068: the 35 catalog DIDs polled slowly, verified: false, after the five verified DIDs; conn main takes it with the tester stop rule, conn#16, no release yet; rt-core must not pass v0.11.0 before the same rule, E-19); v0.11.0 = 1044fb3 (D-066 item 4: generic BLE vehicle-signal block keyed by DID, characteristic vehicleSignals; conn, mobile and server main take it: conn#15, mobile#12, server#9, no releases yet); v0.10.0 = 76682f3 (D-066 host-only signal catalog: 35 unpolled J1979 candidates, Python + Dart; gen/c unchanged); v0.9.0 = 976d33e (D-065 lean_angle_clamp_max_deg 55 deg); v0.8.0 = 8e2de7e (D-060 GPS BLE block); v0.7.0 = 9ac216a (D-059: one byte-exact FC.CTS in the frame gate, discovery_scan); v0.6.0 = c9d85e1 (D-061 BLE schema in defs, telemetry v4). conn main pins v0.6.0 (unreleased); rt-core v0.8.0 pins v0.5.0; rt-core main pins v0.8.0 (D-059 check done, rt-core#25) and takes v0.9.0 with D-065 PR 3

  - name: moto-rt-core
    url: https://github.com/moto-platform/moto-rt-core.git
    ref: v0.8.0           # commit f51b214 (D-056, ISSUES D-5: features/vehicle_republish 0x021 E2E + 0x110 at 50 ms, FDCAN2 dedicated replace-on-new TX buffers + one Tx FIFO element (M_CAN erratum); pins defs v0.5.0)

  - name: moto-connectivity-node
    url: https://github.com/moto-platform/moto-connectivity-node.git
    ref: v0.1.0           # commit 8be145a (D-036)

  - name: moto-safety-node
    url: https://github.com/moto-platform/moto-safety-node.git
    ref: main

  - name: moto-io-node
    url: https://github.com/moto-platform/moto-io-node.git
    ref: main

  - name: moto-linux-node
    url: https://github.com/moto-platform/moto-linux-node.git
    ref: main

  - name: moto-hil-bench
    url: https://github.com/moto-platform/moto-hil-bench.git
    ref: main

  - name: moto-server
    url: https://github.com/moto-platform/moto-server.git
    ref: v0.2.0           # commit 5734ec8 (D-036; GPS sessions, pins defs v0.8.0)

  - name: moto-ml
    url: https://github.com/moto-platform/moto-ml.git
    ref: main

  - name: moto-mobile
    url: https://github.com/moto-platform/moto-mobile.git
    ref: v0.3.0           # commit 3b9e161 (dark redesign, Signals screen from the D-066 catalog; pins defs v0.10.0); v0.2.0 = e02e978 (GPS recording + D-063 local-only upload)

